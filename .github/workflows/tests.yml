name: CPU temporal AI regression tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-vision.txt
      - run: python -m unittest discover -s tests -v
      - run: python vision_train.py --simulate --clips-per-session 40 --data smoke_vision.npz --model models/smoke_loop.npz
      - run: python demo.py --first 1 --second -1
      - run: python benchmark.py --seeds 1 --train 400 --test 200 --output result-smoke.json
